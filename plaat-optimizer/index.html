<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Plaat Optimizer - Kersten Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--accent:#3b82f6;--accent2:#2563eb;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Auth */
#auth{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
#auth .box{background:var(--card);border-radius:16px;padding:40px;max-width:400px;width:100%;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.4)}
#auth .icon{font-size:48px;margin-bottom:16px}
#auth h1{font-size:24px;margin-bottom:8px;color:#f8fafc}
#auth p{color:var(--muted);margin-bottom:24px;font-size:14px}
#auth input{width:100%;padding:14px 16px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;outline:none}
#auth input:focus{border-color:var(--accent)}
#auth button{width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
#auth button:hover{background:var(--accent2)}
#auth .err{color:var(--red);font-size:14px;margin-top:12px;display:none}

#app{display:none;flex-direction:column;min-height:100vh}
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
.hdr a{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13px;text-decoration:none}
.hdr a:hover{border-color:var(--accent);color:var(--accent)}
.hdr h1{font-size:20px;font-weight:700;color:#f8fafc}

.wrap{max-width:1400px;margin:0 auto;padding:20px;display:grid;grid-template-columns:420px 1fr;gap:20px;flex:1}
@media(max-width:960px){.wrap{grid-template-columns:1fr}}

.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:0}
.panel h2{font-size:15px;margin-bottom:14px;color:#f8fafc;display:flex;align-items:center;gap:8px}

.row{display:flex;gap:8px;margin-bottom:8px;align-items:end}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.fg label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{padding:10px;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;outline:none;width:100%}
.fg input:focus{border-color:var(--accent)}

.btn{padding:10px 16px;border-radius:8px;border:none;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-add{background:var(--accent);color:#fff;flex-shrink:0}
.btn-add:hover{background:var(--accent2)}
.btn-sm{background:var(--border);color:var(--text);padding:6px 12px;font-size:12px}
.btn-sm:hover{background:#475569}
.btn-calc{background:var(--green);color:#0f172a;width:100%;padding:14px;font-size:15px;margin-top:16px}
.btn-calc:hover{background:#16a34a}
.btn-clear{background:var(--border);color:var(--text);width:100%;padding:10px;margin-top:8px}
.btn-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px 8px;flex-shrink:0}

.list{margin:8px 0;max-height:280px;overflow-y:auto}
.li{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:13px;gap:8px}
.li .d{font-weight:600;font-family:'Courier New',monospace}
.li .q{color:var(--muted);flex-shrink:0}

.sep{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

/* Stock list */
.stock-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:13px}
.stock-item .d{font-weight:600;font-family:'Courier New',monospace;flex:1}

/* Results */
#res{display:none}
#res.show{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.st{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.st .n{font-size:26px;font-weight:700;color:#f8fafc}
.st .l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:4px;letter-spacing:.3px}

.sv{margin-bottom:14px;background:var(--bg);border-radius:8px;padding:14px}
.sv-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.sv-t{font-weight:700;font-size:14px}
.sv-e{font-size:12px;padding:4px 10px;border-radius:6px;font-weight:600}
.eg{background:#14532d;color:var(--green)}
.em{background:#422006;color:var(--orange)}
.el{background:#450a0a;color:var(--red)}

.cv{position:relative;width:100%;background:#0a0e1a;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.cv canvas{width:100%;display:block}
.sv-parts{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.6}
.sv-parts span{display:inline-block;margin-right:10px}
</style>
</head>
<body>

<div id="auth">
  <div class="box">
    <div class="icon">📐</div>
    <h1>Plaat Optimizer</h1>
    <p>Kersten Tools — voer het wachtwoord in</p>
    <form id="lf">
      <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="off" autofocus>
      <button type="submit">Inloggen</button>
    </form>
    <div class="err" id="err">Verkeerd wachtwoord</div>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <a href="../">← Terug</a>
    <h1>📐 Plaat Optimizer</h1>
  </div>
  <div class="wrap">
    <div>
      <div class="panel">
        <h2>📦 Onderdelen</h2>
        <div class="row">
          <div class="fg"><label>Lengte (mm)</label><input type="number" id="pL" min="1" placeholder="500"></div>
          <div class="fg"><label>Breedte (mm)</label><input type="number" id="pW" min="1" placeholder="300"></div>
          <div class="fg" style="max-width:65px"><label>Aantal</label><input type="number" id="pQ" min="1" value="1"></div>
          <button class="btn btn-add" onclick="addPart()">+</button>
        </div>
        <div class="list" id="parts"></div>

        <div class="sep">
          <h2>📏 Plaatformaten</h2>
          <div class="row">
            <div class="fg"><label>Lengte (mm)</label><input type="number" id="sL" value="6000"></div>
            <div class="fg"><label>Breedte (mm)</label><input type="number" id="sW" value="2000"></div>
            <button class="btn btn-add" onclick="addStock()">+</button>
          </div>
          <div id="stocks"></div>
          <div class="row" style="margin-top:10px">
            <div class="fg"><label>Zaagsnede (mm)</label><input type="number" id="kerf" value="3" min="0" step="0.5"></div>
            <div class="fg"><label>Draaien toestaan</label>
              <select id="rot"><option value="1">Ja</option><option value="0">Nee</option></select>
            </div>
          </div>
        </div>

        <button class="btn btn-calc" onclick="calc()">🔧 Bereken nesting</button>
        <button class="btn btn-clear" onclick="clearAll()">Alles wissen</button>
      </div>
    </div>
    <div id="res">
      <div class="panel">
        <h2>📊 Resultaat</h2>
        <div class="stats" id="stats"></div>
        <div id="vis"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Auth ──
const H='a6efe2e673f8187330d20181cc8ce1bb3f3aacba656b27dc4e6ac8aef0577f50';
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();if(await hash(document.getElementById('pw').value)===H){localStorage.setItem('kersten_auth',H);go()}else{const er=document.getElementById('err');er.style.display='block';document.getElementById('pw').value='';setTimeout(()=>er.style.display='none',2000)}};
function go(){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='flex'}

// ── Data ──
let parts=[];
let stockSizes=[{l:6000,w:2000}];

// Enter key handling
['pL','pW','pQ'].forEach((id,i)=>{document.getElementById(id).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(i<2)document.getElementById(['pL','pW','pQ'][i+1]).focus();else addPart()}}});
['sL','sW'].forEach((id,i)=>{document.getElementById(id).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(i===0)document.getElementById('sW').focus();else addStock()}}});

function addPart(){
  const l=+document.getElementById('pL').value,w=+document.getElementById('pW').value,q=+document.getElementById('pQ').value||1;
  if(!l||!w||l<1||w<1)return alert('Vul lengte en breedte in');
  parts.push({l,w,qty:q});
  document.getElementById('pL').value='';document.getElementById('pW').value='';document.getElementById('pQ').value='1';
  document.getElementById('pL').focus();
  renderParts();
}
function rmPart(i){parts.splice(i,1);renderParts()}
function renderParts(){
  const el=document.getElementById('parts');
  if(!parts.length){el.innerHTML='<div style="color:var(--dim);font-size:13px;padding:10px;text-align:center">Nog geen onderdelen</div>';return}
  el.innerHTML=parts.map((p,i)=>`<div class="li"><span class="d">${p.l} × ${p.w} mm</span><span class="q">×${p.qty}</span><button class="btn-del" onclick="rmPart(${i})">×</button></div>`).join('');
}
renderParts();

function addStock(){
  const l=+document.getElementById('sL').value,w=+document.getElementById('sW').value;
  if(!l||!w||l<1||w<1)return alert('Vul lengte en breedte in');
  if(!stockSizes.find(s=>s.l===l&&s.w===w))stockSizes.push({l,w});
  document.getElementById('sL').value='';document.getElementById('sW').value='';
  renderStocks();
}
function rmStock(i){stockSizes.splice(i,1);renderStocks()}
function renderStocks(){
  document.getElementById('stocks').innerHTML=stockSizes.map((s,i)=>`<div class="stock-item"><span class="d">${s.l} × ${s.w} mm</span><button class="btn-del" onclick="rmStock(${i})">×</button></div>`).join('');
}
renderStocks();

function clearAll(){parts=[];renderParts();document.getElementById('res').classList.remove('show')}

// ── Nesting Engine ──
function calc(){
  if(!parts.length)return alert('Voeg eerst onderdelen toe');
  if(!stockSizes.length)return alert('Voeg minimaal één plaatformaat toe');
  const kerf=+document.getElementById('kerf').value||0;
  const canRot=document.getElementById('rot').value==='1';

  // Expand
  let all=[];
  for(const p of parts)for(let i=0;i<p.qty;i++)all.push({l:p.l,w:p.w,id:`${p.l}×${p.w}`});
  all.sort((a,b)=>(b.l*b.w)-(a.l*a.w));

  // Sort stock sizes largest first
  const stocks=[...stockSizes].sort((a,b)=>(b.l*b.w)-(a.l*a.w));

  class Sheet{
    constructor(sl,sw){this.sl=sl;this.sw=sw;this.free=[{x:0,y:0,l:sl,w:sw}];this.placed=[]}
    tryPlace(pL,pW){
      let best=null,bs=Infinity,br=false;
      for(const r of this.free){
        if(pL+kerf<=r.l&&pW+kerf<=r.w){const s=Math.min(r.l-pL,r.w-pW);if(s<bs){bs=s;best=r;br=false}}
        if(canRot&&pW+kerf<=r.l&&pL+kerf<=r.w){const s=Math.min(r.l-pW,r.w-pL);if(s<bs){bs=s;best=r;br=true}}
      }
      if(!best)return false;
      const pl=br?pW:pL,pw=br?pL:pW;
      this.placed.push({x:best.x,y:best.y,l:pl,w:pw,oL:pL,oW:pW,rot:br});
      this.split(best,pl+kerf,pw+kerf);
      return true;
    }
    split(r,uL,uW){
      const i=this.free.indexOf(r);this.free.splice(i,1);
      if(r.l-uL>kerf)this.free.push({x:r.x+uL,y:r.y,l:r.l-uL,w:r.w});
      if(r.w-uW>kerf)this.free.push({x:r.x,y:r.y+uW,l:uL,w:r.w-uW});
    }
    usedArea(){return this.placed.reduce((s,p)=>s+p.l*p.w,0)}
    eff(){return this.usedArea()/(this.sl*this.sw)*100}
  }

  // Strategy: try all stock sizes for each part, pick best fit
  const sheets=[];
  const unplaced=[];

  for(const part of all){
    let placed=false;
    // Try existing sheets (best fit = highest efficiency after placement)
    let bestSheet=null,bestEff=-1;
    for(const sh of sheets){
      // Clone and test
      const testFree=sh.free.map(r=>({...r}));
      const origFree=sh.free;
      if(sh.tryPlace(part.l,part.w)){
        placed=true;break;
      }
    }
    if(placed)continue;

    // Try new sheet — pick smallest stock that fits
    let bestStock=null,bestWaste=Infinity;
    for(const st of stocks){
      const canFit=(part.l<=st.l&&part.w<=st.w)||(canRot&&part.w<=st.l&&part.l<=st.w);
      if(canFit){
        const waste=st.l*st.w-part.l*part.w;
        if(waste<bestWaste){bestWaste=waste;bestStock=st}
      }
    }
    if(bestStock){
      const sh=new Sheet(bestStock.l,bestStock.w);
      sh.tryPlace(part.l,part.w);
      sheets.push(sh);
    }else{
      unplaced.push(part);
    }
  }

  // Display
  const totalPart=all.reduce((s,p)=>s+p.l*p.w,0);
  const totalSheet=sheets.reduce((s,sh)=>s+sh.sl*sh.sw,0);
  const avgEff=totalSheet>0?(totalPart/totalSheet*100):0;

  // Count per stock size
  const countMap={};
  sheets.forEach(sh=>{const k=`${sh.sl}×${sh.sw}`;countMap[k]=(countMap[k]||0)+1});

  document.getElementById('stats').innerHTML=`
    <div class="st"><div class="n">${sheets.length}</div><div class="l">Platen nodig</div></div>
    <div class="st"><div class="n">${all.length}</div><div class="l">Onderdelen</div></div>
    <div class="st"><div class="n">${avgEff.toFixed(1)}%</div><div class="l">Gem. benutting</div></div>
    <div class="st"><div class="n">${((totalSheet-totalPart)/1e6).toFixed(2)}</div><div class="l">Rest (m²)</div></div>
    ${Object.entries(countMap).map(([k,v])=>`<div class="st"><div class="n">${v}×</div><div class="l">${k} mm</div></div>`).join('')}
    ${unplaced.length?`<div class="st" style="border:2px solid var(--red)"><div class="n" style="color:var(--red)">${unplaced.length}</div><div class="l">Passen niet!</div></div>`:''}
  `;

  // Draw
  const colors=['#3b82f6','#22c55e','#f59e0b','#ef4444','#a855f7','#ec4899','#06b6d4','#84cc16','#f97316','#6366f1'];
  const uParts=[...new Set(all.map(p=>p.id))];
  const cMap={};uParts.forEach((id,i)=>cMap[id]=colors[i%colors.length]);

  const visEl=document.getElementById('vis');visEl.innerHTML='';

  for(let si=0;si<sheets.length;si++){
    const sh=sheets[si];
    const eff=sh.eff();
    const ec=eff>=70?'eg':eff>=40?'em':'el';
    const maxW=Math.min(800,window.innerWidth-100);
    const sc=Math.min(maxW/sh.sl,350/sh.sw);
    const cw=Math.round(sh.sl*sc),ch=Math.round(sh.sw*sc);

    const div=document.createElement('div');div.className='sv';
    div.innerHTML=`
      <div class="sv-hd"><span class="sv-t">Plaat ${si+1} — ${sh.sl}×${sh.sw} mm</span><span class="sv-e ${ec}">${eff.toFixed(1)}%</span></div>
      <div class="cv"><canvas width="${cw}" height="${ch}"></canvas></div>
      <div class="sv-parts">${sh.placed.map(p=>`<span>${p.oL}×${p.oW}${p.rot?' ↻':''}</span>`).join('')}</div>
    `;
    visEl.appendChild(div);

    const ctx=div.querySelector('canvas').getContext('2d');
    ctx.fillStyle='#0a0e1a';ctx.fillRect(0,0,cw,ch);

    for(const p of sh.placed){
      const x=p.x*sc,y=p.y*sc,w=p.l*sc,h=p.w*sc;
      const col=cMap[`${p.oL}×${p.oW}`]||'#3b82f6';
      ctx.fillStyle=col+'40';ctx.fillRect(x,y,w,h);
      ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.strokeRect(x+1,y+1,w-2,h-2);
      if(w>35&&h>16){
        ctx.fillStyle='#fff';ctx.font=`${Math.min(11,Math.max(7,Math.min(w/8,h*.35)))}px sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(`${p.oL}×${p.oW}`,x+w/2,y+h/2);
      }
    }
    ctx.strokeStyle='#475569';ctx.lineWidth=2;ctx.strokeRect(0,0,cw,ch);
  }

  document.getElementById('res').classList.add('show');
}

// Auto-login
if(localStorage.getItem('kersten_auth')===H)go();
</script>
</body>
</html>
