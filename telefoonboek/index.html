<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Telefoonboek - Kersten Tools</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --border-color: #334155;
            --shadow: rgba(0,0,0,0.3);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* === AUTH GATE === */
        .auth-gate {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-gate .login-box {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        .auth-gate .logo { font-size: 48px; margin-bottom: 16px; }
        .auth-gate h1 { font-size: 24px; margin-bottom: 8px; color: #f8fafc; }
        .auth-gate p { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
        .auth-gate input {
            width: 100%; padding: 14px 16px; border-radius: 10px;
            border: 2px solid #334155; background: #0f172a;
            color: #e2e8f0; font-size: 16px; outline: none;
        }
        .auth-gate input:focus { border-color: #3b82f6; }
        .auth-gate button {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: #3b82f6; color: white; font-size: 16px;
            font-weight: 600; cursor: pointer; margin-top: 12px;
        }
        .auth-gate button:hover { background: #2563eb; }
        .login-error { color: #f87171; font-size: 14px; margin-top: 12px; display: none; }

        /* === APP (hidden until auth) === */
        .app { display: none; flex-direction: column; min-height: 100vh; }

        .top-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
        }

        .date-info {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .main-content { flex: 1; padding: 20px; overflow-y: auto; }

        .controls-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-input {
            width: 100%; padding: 9px 12px 9px 36px;
            border: 2px solid var(--border-color); border-radius: 8px;
            font-size: 13px; background: var(--bg-primary);
            color: var(--text-primary);
        }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .search-icon {
            position: absolute; left: 10px; top: 50%;
            transform: translateY(-50%); font-size: 16px; color: var(--text-tertiary);
        }

        .filter-select {
            padding: 10px 16px; border-radius: 8px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary); color: var(--text-primary);
            font-weight: 600; font-size: 13px; cursor: pointer; min-width: 180px;
        }
        .filter-select:focus { outline: none; border-color: var(--accent); }

        .manage-categories-btn {
            padding: 10px 16px; border-radius: 8px;
            border: 2px solid var(--accent);
            background: var(--bg-secondary); color: var(--accent);
            font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .manage-categories-btn:hover { background: var(--accent); color: white; }

        .data-btn {
            padding: 10px 16px; border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary); color: var(--text-secondary);
            font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .data-btn:hover { border-color: var(--accent); color: var(--accent); }

        .category-badge {
            display: inline-block; padding: 3px 8px; border-radius: 10px;
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; background: var(--border-color); color: var(--text-primary);
        }

        .suppliers-grid {
            column-count: 4; column-gap: 16px; margin-bottom: 80px;
        }
        @media (max-width: 1400px) { .suppliers-grid { column-count: 3; } }
        @media (max-width: 1000px) { .suppliers-grid { column-count: 2; } }
        @media (max-width: 768px) { .suppliers-grid { column-count: 1; } }

        .supplier-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 14px; transition: all 0.3s ease;
            border-left: 4px solid var(--accent); cursor: move;
            break-inside: avoid; margin-bottom: 16px; display: inline-block; width: 100%;
        }
        .supplier-card:hover { box-shadow: 0 3px 10px var(--shadow); transform: translateY(-1px); }
        .supplier-card.sortable-ghost { opacity: 0.4; }

        .supplier-name {
            font-size: 15px; font-weight: 600; margin-bottom: 10px;
            padding-bottom: 8px; border-bottom: 2px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .supplier-name-content { display: flex; align-items: center; gap: 8px; flex: 1; }

        .contact-item {
            margin-bottom: 6px; font-size: 14px; color: var(--text-secondary);
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 0; border-bottom: 1px solid var(--border-color);
        }
        .contact-item:last-child { border-bottom: none; margin-bottom: 0; }
        .contact-label { font-weight: 500; color: var(--text-tertiary); min-width: 100px; }
        .contact-value {
            color: var(--text-primary); font-weight: 600; text-align: right;
            font-family: 'Courier New', monospace; letter-spacing: 0.3px; font-size: 14px;
        }
        .contact-value a {
            color: var(--text-primary); text-decoration: none;
        }
        .contact-value a:hover { color: var(--accent); }

        .add-button {
            position: fixed; bottom: 32px; right: 32px;
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--accent); color: white; border: none;
            font-size: 32px; cursor: pointer; box-shadow: 0 4px 16px var(--shadow);
            transition: all 0.3s ease; display: flex; align-items: center;
            justify-content: center; z-index: 100;
        }
        .add-button:hover { transform: scale(1.1) rotate(90deg); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: none;
            align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary); border-radius: 16px; padding: 32px;
            max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 8px 32px var(--shadow);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border-color);
        }
        .modal-title { font-size: 24px; font-weight: 600; }
        .modal-close {
            background: none; border: none; font-size: 28px; cursor: pointer;
            color: var(--text-secondary); width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center; border-radius: 4px;
        }
        .modal-close:hover { background: var(--border-color); color: var(--text-primary); }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .form-input {
            width: 100%; padding: 12px; border: 2px solid var(--border-color);
            border-radius: 8px; font-size: 14px; background: var(--bg-primary);
            color: var(--text-primary);
        }
        .form-input:focus { outline: none; border-color: var(--accent); }

        .contact-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .contact-row input { flex: 1; }
        .remove-contact, .remove-category {
            background: #ef4444; color: white; border: none; border-radius: 6px;
            padding: 10px 14px; cursor: pointer; font-weight: 600;
        }
        .remove-contact:hover, .remove-category:hover { background: #dc2626; }

        .add-contact, .add-category {
            background: var(--accent); color: white; border: none; border-radius: 8px;
            padding: 10px 16px; cursor: pointer; font-weight: 600; font-size: 14px; margin-top: 8px;
        }
        .add-contact:hover, .add-category:hover { background: var(--accent-hover); }

        .color-picker-wrapper { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        .color-option {
            width: 50px; height: 50px; border-radius: 8px; cursor: pointer;
            border: 3px solid transparent; transition: all 0.2s;
        }
        .color-option:hover { transform: scale(1.1); }
        .color-option.selected { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--bg-secondary); }

        .modal-actions {
            display: flex; gap: 12px; justify-content: flex-end;
            margin-top: 32px; padding-top: 20px; border-top: 2px solid var(--border-color);
        }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--border-color); color: var(--text-primary); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }

        .category-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
        .category-row input { flex: 1; }

        @media (max-width: 768px) {
            .main-content { padding: 16px; }
            .add-button { width: 56px; height: 56px; font-size: 28px; bottom: 20px; right: 20px; }
            .top-header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<!-- AUTH GATE -->
<div class="auth-gate" id="authGate">
    <div class="login-box">
        <div class="logo">📞</div>
        <h1>Telefoonboek</h1>
        <p>Kersten Tools — voer het wachtwoord in</p>
        <form id="loginForm">
            <input type="password" id="passwordInput" placeholder="Wachtwoord" autocomplete="off" autofocus>
            <button type="submit">Inloggen</button>
        </form>
        <div class="login-error" id="loginError">Verkeerd wachtwoord</div>
    </div>
</div>

<!-- APP -->
<div class="app" id="app">
    <div class="top-header">
        <div class="header-left">
            <a href="../" class="back-btn">← Terug</a>
            <span class="header-title">📞 Telefoonboek</span>
        </div>
        <div class="date-info" id="dateInfo"></div>
    </div>

    <main class="main-content">
        <div class="controls-bar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Zoek leverancier of contactpersoon...">
            </div>
            <select id="categoryFilter" class="filter-select">
                <option value="all">Alle categorieën</option>
            </select>
            <button class="manage-categories-btn" id="manageCategoriesBtn">⚙️ Categorieën</button>
            <button class="data-btn" id="exportDataBtn" title="Exporteer alle data als JSON">📥 Export</button>
            <button class="data-btn" id="importDataBtn" title="Importeer data uit JSON bestand">📤 Import</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none">
        </div>
        <div class="suppliers-grid" id="suppliersGrid"></div>
    </main>

    <button class="add-button" id="addButton" title="Leverancier toevoegen">+</button>

    <!-- Categories modal -->
    <div class="modal-overlay" id="categoriesModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Categorieën beheren</h2>
                <button class="modal-close" id="categoriesModalClose">×</button>
            </div>
            <form id="categoriesForm">
                <div class="form-group">
                    <label class="form-label">Categorieën</label>
                    <div class="categories-list" id="categoriesList"></div>
                    <button type="button" class="add-category" id="addCategory">+ Categorie toevoegen</button>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelCategoriesButton">Annuleren</button>
                    <button type="submit" class="btn btn-primary">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supplier modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Nieuwe leverancier</h2>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <form id="supplierForm">
                <input type="hidden" id="supplierId">
                <div class="form-group">
                    <label class="form-label" for="supplierName">Bedrijfsnaam</label>
                    <input type="text" id="supplierName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="supplierCategory">Categorie</label>
                    <select id="supplierCategory" class="form-input">
                        <option value="overig">Overig</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Kleur</label>
                    <div class="color-picker-wrapper" id="colorPicker">
                        <div class="color-option selected" data-color="#3b82f6" style="background:#3b82f6"></div>
                        <div class="color-option" data-color="#003D7A" style="background:#003D7A"></div>
                        <div class="color-option" data-color="#00A3DD" style="background:#00A3DD"></div>
                        <div class="color-option" data-color="#FF8C00" style="background:#FF8C00"></div>
                        <div class="color-option" data-color="#FF7A3D" style="background:#FF7A3D"></div>
                        <div class="color-option" data-color="#EA7139" style="background:#EA7139"></div>
                        <div class="color-option" data-color="#475569" style="background:#475569"></div>
                        <div class="color-option" data-color="#22c55e" style="background:#22c55e"></div>
                        <div class="color-option" data-color="#ef4444" style="background:#ef4444"></div>
                        <div class="color-option" data-color="#a855f7" style="background:#a855f7"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Contactgegevens</label>
                    <div class="contacts-list" id="contactsList"></div>
                    <button type="button" class="add-contact" id="addContact">+ Contact toevoegen</button>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-danger" id="deleteButton" style="display:none;margin-right:auto">Verwijderen</button>
                    <button type="button" class="btn btn-secondary" id="cancelButton">Annuleren</button>
                    <button type="submit" class="btn btn-primary">Opslaan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // ============ AUTH ============
    const CORRECT_HASH = 'a6efe2e673f8187330d20181cc8ce1bb3f3aacba656b27dc4e6ac8aef0577f50';

    async function hashPassword(pw) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    (async () => {
        if (localStorage.getItem('kersten_auth') === CORRECT_HASH) showApp();
    })();

    document.getElementById('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const hash = await hashPassword(document.getElementById('passwordInput').value);
        if (hash === CORRECT_HASH) {
            localStorage.setItem('kersten_auth', CORRECT_HASH);
            showApp();
        } else {
            const err = document.getElementById('loginError');
            err.style.display = 'block';
            document.getElementById('passwordInput').value = '';
            setTimeout(() => err.style.display = 'none', 2000);
        }
    });

    function showApp() {
        document.getElementById('authGate').style.display = 'none';

    const defaultCategories = [
        {name:'overig'},{name:'conserveren'},{name:'snijden/kanten'},{name:'plaat/profiel leverancier'},
        {name:'bevestigingsmiddelen'},{name:'draaien/frezen'},{name:'glas'}
    ];

    const DATA_VERSION = 3; // bumped to force reload for users with broken/empty data
    let suppliers = [], categories = [], currentEditId = null, selectedColor = '#3b82f6';
    let currentFilter = 'all', currentSearch = '';

    function init() {
        loadCategories(); loadSuppliers();
        renderCategoryFilter(); renderSuppliers(); setupSortable();
        setupEventListeners(); updateDate();
    }

    function loadCategories() {
        const s = localStorage.getItem('telefoonboek_categories');
        categories = s ? JSON.parse(s) : defaultCategories;
        if (!s) saveCategories();
    }
    function saveCategories() { localStorage.setItem('telefoonboek_categories', JSON.stringify(categories)); }

    function loadSuppliers() {
        const ver = localStorage.getItem('telefoonboek_version');
        const s = localStorage.getItem('telefoonboek_suppliers');
        if (s && ver && parseInt(ver) >= DATA_VERSION) {
            const parsed = JSON.parse(s).map(x => ({...x, category: x.category||'overig'}));
            // If stored data has less than 10 items, assume it's from a broken first load
            if (parsed.length >= 10) {
                suppliers = parsed;
                return;
            }
        }
        // Default: load initial data
        {
            suppliers = initialSuppliers;
            saveSuppliers();
            localStorage.setItem('telefoonboek_version', DATA_VERSION);
        }
    }
    function saveSuppliers() {
        localStorage.setItem('telefoonboek_suppliers', JSON.stringify(suppliers));
        localStorage.setItem('telefoonboek_version', DATA_VERSION);
    }

    function getFiltered() {
        let f = [...suppliers];
        if (currentFilter !== 'all') f = f.filter(s => (s.category||'overig') === currentFilter);
        if (currentSearch) {
            const q = currentSearch.toLowerCase();
            f = f.filter(s => s.name.toLowerCase().includes(q) ||
                s.contacts.some(c => c.label.toLowerCase().includes(q) || c.value.includes(q)));
        }
        return f;
    }

    function renderCategoryFilter() {
        const cats = [...new Set(suppliers.map(s => s.category||'overig'))];
        document.getElementById('categoryFilter').innerHTML =
            `<option value="all">Alle categorieën (${suppliers.length})</option>` +
            cats.map(c => {
                const n = suppliers.filter(s => (s.category||'overig')===c).length;
                return `<option value="${c}">${c[0].toUpperCase()+c.slice(1)} (${n})</option>`;
            }).join('');
        document.getElementById('categoryFilter').value = currentFilter;
    }

    function makeClickable(val) {
        const digits = val.replace(/\s/g, '');
        if (/^\+?\d{7,}$/.test(digits)) return `<a href="tel:${digits}">${val}</a>`;
        return val;
    }

    function renderSuppliers() {
        const f = getFiltered();
        document.getElementById('suppliersGrid').innerHTML = f.map(s => `
            <div class="supplier-card" data-id="${s.id}" style="border-left-color:${s.color}">
                <div class="supplier-name">
                    <div class="supplier-name-content"><span>${s.name}</span></div>
                    <div class="category-badge">${(s.category||'overig').toUpperCase()}</div>
                </div>
                ${s.contacts.map(c => `
                    <div class="contact-item">
                        <span class="contact-label">${c.label}:</span>
                        <span class="contact-value">${makeClickable(c.value)}</span>
                    </div>`).join('')}
            </div>`).join('');

        document.querySelectorAll('.supplier-card').forEach(card => {
            card.addEventListener('click', e => {
                if (e.target.tagName === 'A') return; // don't open modal on phone link click
                openEditModal(card.dataset.id);
            });
        });
    }

    function setupSortable() {
        const grid = document.getElementById('suppliersGrid');
        if (grid.sortable) grid.sortable.destroy();
        if (currentFilter === 'all' && !currentSearch) {
            grid.sortable = new Sortable(grid, {
                animation: 150, ghostClass: 'sortable-ghost',
                onEnd: evt => { const m = suppliers.splice(evt.oldIndex,1)[0]; suppliers.splice(evt.newIndex,0,m); saveSuppliers(); }
            });
        }
    }

    function setupEventListeners() {
        document.getElementById('addButton').addEventListener('click', openAddModal);
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('cancelButton').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target.id==='modalOverlay') closeModal(); });
        document.getElementById('supplierForm').addEventListener('submit', handleSubmit);
        document.getElementById('deleteButton').addEventListener('click', handleDelete);
        document.getElementById('addContact').addEventListener('click', () => addContactRow());
        document.getElementById('searchInput').addEventListener('input', e => { currentSearch=e.target.value.trim(); renderSuppliers(); setupSortable(); });
        document.getElementById('categoryFilter').addEventListener('change', e => { currentFilter=e.target.value; renderSuppliers(); setupSortable(); });

        document.getElementById('manageCategoriesBtn').addEventListener('click', openCategoriesModal);
        document.getElementById('categoriesModalClose').addEventListener('click', closeCategoriesModal);
        document.getElementById('cancelCategoriesButton').addEventListener('click', closeCategoriesModal);
        document.getElementById('categoriesModalOverlay').addEventListener('click', e => { if(e.target.id==='categoriesModalOverlay') closeCategoriesModal(); });
        document.getElementById('categoriesForm').addEventListener('submit', handleCategoriesSubmit);
        document.getElementById('addCategory').addEventListener('click', () => addCategoryRow());

        // Export / Import
        document.getElementById('exportDataBtn').addEventListener('click', exportData);
        document.getElementById('importDataBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
        document.getElementById('importFileInput').addEventListener('change', importData);

        document.querySelectorAll('.color-option').forEach(o => o.addEventListener('click', () => {
            document.querySelectorAll('.color-option').forEach(x => x.classList.remove('selected'));
            o.classList.add('selected'); selectedColor = o.dataset.color;
        }));
    }

    function updateDate() {
        const now = new Date();
        const days = ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
        const d = new Date(now); d.setHours(0,0,0,0);
        d.setDate(d.getDate()+3-(d.getDay()+6)%7);
        const w1 = new Date(d.getFullYear(),0,4);
        const wk = 1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7);
        document.getElementById('dateInfo').textContent = `${days[now.getDay()]} • Week ${wk}`;
    }

    // Category modal
    function openCategoriesModal() {
        document.getElementById('categoriesList').innerHTML = '';
        categories.forEach(c => addCategoryRow(c.name));
        document.getElementById('categoriesModalOverlay').classList.add('active');
    }
    function closeCategoriesModal() { document.getElementById('categoriesModalOverlay').classList.remove('active'); }
    function addCategoryRow(name='') {
        const row = document.createElement('div'); row.className = 'category-row';
        row.innerHTML = `<input type="text" class="form-input category-name-input" placeholder="Categorienaam" value="${name}" ${name==='overig'?'readonly':''}>`
            + (name!=='overig' ? '<button type="button" class="remove-category">×</button>' : '');
        if (name!=='overig') row.querySelector('.remove-category').addEventListener('click', () => row.remove());
        document.getElementById('categoriesList').appendChild(row);
    }
    function handleCategoriesSubmit(e) {
        e.preventDefault();
        categories = [];
        document.querySelectorAll('.category-row').forEach(r => {
            const n = r.querySelector('.category-name-input').value.trim().toLowerCase();
            if (n) categories.push({name:n});
        });
        if (!categories.find(c=>c.name==='overig')) categories.unshift({name:'overig'});
        saveCategories(); renderCategoryFilter(); renderSuppliers(); closeCategoriesModal();
    }

    // Supplier modal
    function updateCategorySelect() {
        document.getElementById('supplierCategory').innerHTML =
            categories.map(c => `<option value="${c.name}">${c.name[0].toUpperCase()+c.name.slice(1)}</option>`).join('');
    }
    function openAddModal() {
        currentEditId = null;
        document.getElementById('modalTitle').textContent = 'Nieuwe leverancier';
        document.getElementById('deleteButton').style.display = 'none';
        document.getElementById('supplierForm').reset();
        selectedColor = '#3b82f6';
        document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
        document.querySelector('.color-option[data-color="#3b82f6"]').classList.add('selected');
        updateCategorySelect();
        document.getElementById('contactsList').innerHTML = '';
        addContactRow();
        document.getElementById('modalOverlay').classList.add('active');
    }
    function openEditModal(id) {
        const s = suppliers.find(x => x.id===id); if (!s) return;
        currentEditId = id;
        document.getElementById('modalTitle').textContent = 'Leverancier bewerken';
        document.getElementById('deleteButton').style.display = 'block';
        document.getElementById('supplierName').value = s.name;
        selectedColor = s.color;
        updateCategorySelect();
        document.getElementById('supplierCategory').value = s.category||'overig';
        document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
        const co = document.querySelector(`.color-option[data-color="${s.color}"]`);
        if (co) co.classList.add('selected');
        document.getElementById('contactsList').innerHTML = '';
        s.contacts.forEach(c => addContactRow(c.label, c.value));
        document.getElementById('modalOverlay').classList.add('active');
    }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); currentEditId=null; }

    function addContactRow(label='', value='') {
        const row = document.createElement('div'); row.className = 'contact-row';
        row.innerHTML = `<input type="text" class="form-input contact-label-input" placeholder="Label" value="${label}">
            <input type="text" class="form-input contact-value-input" placeholder="Telefoonnummer" value="${value}">
            <button type="button" class="remove-contact">×</button>`;
        row.querySelector('.remove-contact').addEventListener('click', () => row.remove());
        document.getElementById('contactsList').appendChild(row);
    }

    function handleSubmit(e) {
        e.preventDefault();
        const name = document.getElementById('supplierName').value.trim();
        const category = document.getElementById('supplierCategory').value;
        if (!name) return;
        const contacts = [];
        document.querySelectorAll('.contact-row').forEach(r => {
            const l = r.querySelector('.contact-label-input').value.trim();
            const v = r.querySelector('.contact-value-input').value.trim();
            if (l && v) contacts.push({label:l, value:v});
        });
        if (currentEditId) {
            const i = suppliers.findIndex(s=>s.id===currentEditId);
            if (i!==-1) suppliers[i] = {...suppliers[i], name, color:selectedColor, category, contacts};
        } else {
            suppliers.push({id:'s_'+Date.now(), name, color:selectedColor, category, contacts});
        }
        saveSuppliers(); renderCategoryFilter(); renderSuppliers(); setupSortable(); closeModal();
    }

    function handleDelete() {
        if (!currentEditId) return;
        if (confirm('Weet je zeker dat je deze leverancier wilt verwijderen?')) {
            suppliers = suppliers.filter(s=>s.id!==currentEditId);
            saveSuppliers(); renderCategoryFilter(); renderSuppliers(); setupSortable(); closeModal();
        }
    }

    // Export all data as JSON
    function exportData() {
        const data = { suppliers, categories, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'telefoonboek-backup.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    // Import data from JSON
    function importData(e) {
        const file = e.target.files[0]; if (!file) return;
        e.target.value = '';
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (!data.suppliers || !Array.isArray(data.suppliers)) {
                    alert('Ongeldig bestand — geen leveranciers gevonden.'); return;
                }
                const count = data.suppliers.length;
                if (!confirm(`${count} leverancier(s) importeren? Dit vervangt alle huidige data.`)) return;
                suppliers = data.suppliers;
                if (data.categories) categories = data.categories;
                saveSuppliers(); saveCategories();
                renderCategoryFilter(); renderSuppliers(); setupSortable();
                alert(`${count} leverancier(s) geïmporteerd!`);
            } catch (err) { alert('Kon bestand niet lezen: ' + err.message); }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
